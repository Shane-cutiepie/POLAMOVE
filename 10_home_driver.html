<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PolaMove — Home — Driver</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#C41E3A;--rl:#E0314F;--rd:#9B1830;--rg:rgba(196,30,58,.13);--rs:0 8px 32px rgba(196,30,58,.32);--bg:#0B0B10;--s1:#141419;--s2:#1C1C24;--s3:#24242E;--b1:rgba(255,255,255,.06);--b2:rgba(255,255,255,.11);--b3:rgba(255,255,255,.18);--t1:#F0F0F8;--t2:#9090B0;--t3:#50507A;--grn:#15803D;--grn2:#22C55E;--grn3:rgba(34,197,94,.13);--amber:#B45309;--r:12px;--rL:20px;--rXL:28px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#05050A;font-family:'DM Sans',sans-serif;color:var(--t1);-webkit-font-smoothing:antialiased;overflow:hidden}
.wrap{display:flex;align-items:center;justify-content:center;width:100%;height:100vh}
.phone{width:390px;min-width:390px;height:100vh;max-height:844px;position:relative;overflow:hidden;background:var(--bg);box-shadow:0 0 0 1px rgba(255,255,255,.05),0 40px 120px rgba(0,0,0,.9)}
@media(min-height:860px){.phone{border-radius:44px;height:844px}}
.btn-r{width:100%;padding:14px;border:none;border-radius:var(--rL);background:linear-gradient(135deg,var(--rl),var(--red));color:#fff;font-family:'Syne',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;box-shadow:var(--rs)}
.btn-r:hover{transform:translateY(-2px)}
.ml{position:absolute;inset:0;z-index:0}
.leaflet-control-container{display:none!important}
.topbar{background:var(--red);padding:15px 18px 44px;position:relative;overflow:hidden;flex-shrink:0}
.tb-mesh{position:absolute;inset:0;background:radial-gradient(ellipse 70% 90% at 95% 0%,rgba(255,255,255,.11),transparent)}
.tb-row{display:flex;align-items:flex-start;justify-content:space-between;position:relative;z-index:1}
.tb-name{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;color:#fff}
.tb-sub{font-size:12px;color:rgba(255,255,255,.66);margin-top:2px}
.tb-ico{width:37px;height:37px;border-radius:11px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;flex-shrink:0;position:relative}
.ndot{position:absolute;top:6px;right:6px;width:7px;height:7px;background:#FBBF24;border-radius:50%;border:1.5px solid var(--red)}
.map-zone{flex:1;position:relative;margin-top:-22px}
.np-pill{position:absolute;top:9px;right:9px;z-index:10;background:var(--s1);border:1.5px solid var(--b2);border-radius:var(--r);padding:7px 11px;display:flex;align-items:center;gap:7px;pointer-events:none}
.np-n{font-family:'Syne',sans-serif;font-size:19px;font-weight:800;color:var(--rl)}.np-l{font-size:10px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.3px}
.bnav{background:var(--s1);border-top:1px solid rgba(255,255,255,.06);display:flex;padding:5px 0 18px;flex-shrink:0}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;padding:3px}
.nb-box{width:38px;height:27px;border-radius:50px;display:flex;align-items:center;justify-content:center;font-size:17px}
.nb.on .nb-box{background:var(--rg)}.nb-lbl{font-size:9px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.3px}
.nb.on .nb-lbl{color:var(--rl)}
.phdr{display:flex;align-items:center;gap:10px;padding:12px 15px;background:var(--s1);border-bottom:1px solid rgba(255,255,255,.06);flex-shrink:0}
.bkbtn{width:34px;height:34px;border-radius:9px;background:var(--s2);border:1.5px solid rgba(255,255,255,.11);display:flex;align-items:center;justify-content:center;font-size:17px;cursor:pointer;color:var(--t2);line-height:1;flex-shrink:0}
.ptitle{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;color:var(--t1)}
.list-body{flex:1;overflow-y:auto}.list-body::-webkit-scrollbar{display:none}
.hist-item{display:flex;align-items:center;gap:11px;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.04)}
.hi-ico{width:38px;height:38px;border-radius:11px;background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.hi-dest{font-size:13px;font-weight:600;color:var(--t1)}.hi-meta{font-size:11px;color:var(--t3);margin-top:2px}.hi-fare{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:var(--grn2);margin-left:auto}
.notif-item{display:flex;align-items:flex-start;gap:10px;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.04)}
.npip{width:7px;height:7px;border-radius:50%;background:var(--rl);flex-shrink:0;margin-top:4px}.npip.r{background:var(--t3)}
.prof-hero{background:var(--red);padding:26px 20px 44px;flex-shrink:0;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:5px}
.ph-mesh{position:absolute;inset:0;background:radial-gradient(ellipse 80% 100% at 100% 0%,rgba(255,255,255,.09),transparent)}
.ph-ava{width:66px;height:66px;border-radius:50%;background:rgba(255,255,255,.16);border:3px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-size:28px;position:relative;z-index:1}
.ph-nm{font-family:'Syne',sans-serif;font-size:19px;font-weight:800;color:#fff;position:relative;z-index:1}
.ph-rl{font-size:12px;color:rgba(255,255,255,.65);position:relative;z-index:1}
.ph-stats{display:flex;gap:18px;margin-top:7px;position:relative;z-index:1}
.ph-st{text-align:center}.ph-sv{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;color:#fff}.ph-sk{font-size:10px;color:rgba(255,255,255,.58);text-transform:uppercase;letter-spacing:.4px}
.msec{padding:12px 16px 0;background:var(--bg)}
.msl{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:5px;margin-top:3px}
.mrow{display:flex;align-items:center;gap:12px;padding:12px 13px;background:var(--s1);border-radius:var(--r);margin-bottom:6px;cursor:pointer;transition:all .16s;border:1px solid transparent}
.mrow:hover{border-color:rgba(255,255,255,.11);background:var(--s2)}.mrow.danger:hover{border-color:rgba(196,30,58,.28);background:rgba(196,30,58,.05)}
.mi{font-size:16px;width:20px;text-align:center}.ml{font-size:13px;font-weight:600;color:var(--t1)}.ma{font-size:15px;color:var(--t3);margin-left:auto}
.mrow.danger .ml{color:var(--rl)}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--s1);border:1px solid rgba(255,255,255,.11);border-radius:50px;padding:9px 18px;font-size:13px;font-weight:600;color:var(--t1);z-index:9999;opacity:0;transition:all .25s;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.online-pill{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:50px;padding:5px 12px;cursor:pointer;position:relative;z-index:1;margin-top:7px;transition:all .18s}
.otog{width:34px;height:19px;border-radius:50px;background:#FF3B5C;position:relative;transition:background .23s;flex-shrink:0}
.otog::after{content:'';position:absolute;width:15px;height:15px;border-radius:50%;background:#fff;top:2px;left:2px;transition:transform .23s}
.otog.on{background:#22C55E}.otog.on::after{transform:translateX(15px)}
.otl{font-size:12px;font-weight:700;color:#fff}
.earn-card{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.17);border-radius:var(--rL);padding:13px 15px;display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1;margin-top:9px}
.earn-amt{font-family:'Syne',sans-serif;font-size:24px;font-weight:800;color:#fff}
.earn-lbl{font-size:10px;color:rgba(255,255,255,.62);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.earn-tc{font-family:'Syne',sans-serif;font-size:17px;font-weight:700;color:rgba(255,255,255,.88)}
.req-card{background:var(--s1);border:1.5px solid var(--rl);border-radius:var(--rXL);padding:15px;margin:10px 15px 6px;animation:slideUp .3s cubic-bezier(.34,1.2,.64,1)}
@keyframes slideUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.req-route{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:var(--t1)}
.req-meta{font-size:12px;color:var(--t2);margin-top:2px}
.req-fare{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:var(--rl);margin-top:5px}
.req-btns{display:flex;gap:7px;margin-top:11px}
.acc-btn{flex:1;padding:11px;border:none;border-radius:var(--rL);background:linear-gradient(135deg,#22C55E,#15803D);color:#fff;font-family:'Syne',sans-serif;font-size:13px;font-weight:700;cursor:pointer}
.dec-btn{flex:1;padding:11px;border:1.5px solid rgba(255,255,255,.11);border-radius:var(--rL);background:none;color:var(--t2);font-size:13px;font-weight:600;cursor:pointer}

</style>
</head>
<body>
<div class="wrap"><div class="phone">

<div style="position:absolute;inset:0;display:flex;flex-direction:column;">
  <div class="topbar">
    <div class="tb-mesh"></div>
    <div class="tb-row">
      <div><div class="tb-name">Hi, Carlos! 🛺</div><div class="tb-sub">Polangui Tricycle Driver</div></div>
      <button class="tb-ico" onclick="showToast('→ Notifications')">🔔<div class="ndot"></div></button>
    </div>
    <div class="online-pill" onclick="toggleOnline()">
      <div class="otog on" id="otog"></div>
      <span class="otl" id="otl">Online</span>
    </div>
    <div class="earn-card">
      <div><div class="earn-lbl">Today's Earnings</div><div class="earn-amt">₱<span id="d-earn">120</span></div></div>
      <div style="text-align:right"><div class="earn-lbl">Trips</div><div class="earn-tc" id="d-trips">6</div></div>
    </div>
  </div>
  <div class="map-zone">
    <div id="map-drv-home" class="ml"></div>
    <div class="np-pill"><div><div class="np-n">1</div><div class="np-l">You</div></div><span style="font-size:18px">📍</span></div>
  </div>
  <div class="req-card" id="req-card">
    <div class="req-route">Centro → Polangui Public Market</div>
    <div class="req-meta">🚖 PolaSolo · 0.8 km away</div>
    <div class="req-fare">₱20</div>
    <div class="req-btns">
      <button class="acc-btn" onclick="showToast('✅ Accepted! → Driver Tracking')">✓ Accept</button>
      <button class="dec-btn" onclick="showToast('❌ Declined');document.getElementById('req-card').style.display='none'">✗ Decline</button>
    </div>
  </div>
  <div class="bnav">
    <button class="nb on"><div class="nb-box">🏠</div><div class="nb-lbl">Home</div></button>
    <button class="nb" onclick="showToast('→ History')"><div class="nb-box">🕐</div><div class="nb-lbl">History</div></button>
    <button class="nb" onclick="showToast('→ Notifications')"><div class="nb-box">🔔</div><div class="nb-lbl">Notifs</div></button>
    <button class="nb" onclick="showToast('→ Profile')"><div class="nb-box">👤</div><div class="nb-lbl">Profile</div></button>
  </div>
</div>
</div></div>
<div class="toast" id="toast"></div>
<script>
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2500);}
function mkIcon(e,sz){return L.divIcon({html:`<div style="font-size:${sz}px;line-height:1;filter:drop-shadow(0 2px 6px rgba(0,0,0,.55))">${e}</div>`,iconAnchor:[sz/2,sz],className:''});}
function mkTrike(sz){return L.divIcon({html:`<div style="font-size:${sz}px;line-height:1;filter:drop-shadow(0 2px 8px rgba(196,30,58,.7))">${sz>22?'🛺':'🛺'}</div>`,iconAnchor:[sz/2,sz],className:''});}
function tiles(m){L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{maxZoom:19,subdomains:'abcd'}).addTo(m);}

const CENTER=[13.2931,123.4879];
let isOnline=true;
function toggleOnline(){isOnline=!isOnline;document.getElementById('otog').className='otog'+(isOnline?' on':'');document.getElementById('otl').textContent=isOnline?'Online':'Offline';showToast(isOnline?'🟢 You are Online':'⚫ You are Offline');}
window.addEventListener('load',()=>{
  const m=L.map('map-drv-home',{zoomControl:false,attributionControl:false,dragging:false,scrollWheelZoom:false}).setView(CENTER,15);
  tiles(m);
  L.marker(CENTER,{icon:mkTrike(26),zIndexOffset:100}).addTo(m);
});
</script>
</body>
</html>
